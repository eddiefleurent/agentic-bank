[project]
name = "agentic-bank"
version = "0.1.0"
description = "A fictional bank that customers use through their own AI agent."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bank"]

[dependency-groups]
dev = [
    "boto3>=1.44.0",
    "pytest",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# SVG markup strings in the diagram generator read better unwrapped.
"docs/diagrams/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["scripts", "proofs"]
